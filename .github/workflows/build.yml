name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-x64-release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/x64-release -C Release --output-on-failure
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Isle-x64
          path: build/**/Release/Isle.exe
